error.report.notice=ReStudio opens a new issue in the <a href="https://github.com/onuragtas/ReStudio/issues">ReStudio repository</a> in your browser. \
  The issue contains the error details shown above, the IDE version and the operating system. \
  Nothing goes to GitHub until you submit the issue. Remove private data before you submit it.
