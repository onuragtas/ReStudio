# Fork only: builds the IDE installers and publishes them as a GitHub release.
#
# It does not call ide_build_and_upload.yml. That workflow uses .github/actions/build_ide, which checks out
# JetBrains/android at github.ref. The fork branch and the release tags do not exist in JetBrains/android, so the
# checkout fails. This workflow checks out JetBrains/android at the upstream base tag in fork/UPSTREAM_BASE.
#
# Start it with a tag push (restudio/v0.1.0) or by hand. A run by hand without a tag builds the installers only.
name: Fork - release

on:
  push:
    tags:
      - 'restudio/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example restudio/v0.1.0. Leave it empty to build without a release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACTS_DIR: out/idea-ce/artifacts

jobs:
  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      build: ${{ steps.base.outputs.build }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Free disk space
        shell: bash
        # The same cleanup as .github/actions/build_ide. The build runs inside Docker.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/microsoft /opt/google \
            /imagegeneration /var/cache/apt/archives
          sudo apt-get -y clean
          docker image prune --all --force || true
          docker builder prune --all --force || true
          df -h /

      - name: Expand swap
        shell: bash
        # The build can run out of memory with the default 4 GB swap.
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Read the upstream base
        id: base
        shell: bash
        # The build number is the branch and the build of the upstream base, then 1000 + the run number.
        # The IDE shows an update only for a higher build number. A build without a number is a SNAPSHOT build,
        # and the IDE never shows an update for it.
        run: |
          tag=$(tr -d '[:space:]' < fork/UPSTREAM_BASE)
          version=${tag#idea/}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$(cut -d. -f1-2 <<< "$version").$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Checkout JetBrains/android at the upstream base
        uses: actions/checkout@v6.0.2
        with:
          repository: JetBrains/android
          path: android
          ref: refs/tags/${{ steps.base.outputs.tag }}

      - name: Fetch the bundled plugins
        shell: bash
        # The build reads out/restudio-plugins. Without it, the installers have no Dart, Flutter, Python and LSP4IJ.
        run: fork/fetch-bundled-plugins.sh

      - name: Build environment
        shell: bash
        run: docker build . --target intellij_idea --tag intellij_idea

      - name: Build
        shell: bash
        run: docker run --rm --user "$(id -u)" --volume "${PWD}:/community" intellij_idea -Dbuild.number=${{ steps.base.outputs.build }}

      - name: Check the bundled plugins
        shell: bash
        # Stops the release if the Linux archive has no path plugins or no Python plugin.
        run: |
          for archive in "$ARTIFACTS_DIR"/*.tar.gz; do
            contents=$(tar -tzf "$archive")
            for entry in restudio-plugins/Dart/ restudio-plugins/flutter-intellij/ restudio-plugins/lsp4ij/ plugins/python-ce/; do
              if ! grep -q "/$entry" <<< "$contents"; then
                echo "$archive has no $entry" >&2
                exit 1
              fi
            done
            echo "$archive has the bundled plugins"
          done

      - name: Upload Linux
        uses: ./.github/actions/fork-upload
        with:
          name: linux.tar.gz-unsigned
          file: ReStudio-${{ steps.base.outputs.build }}.tar.gz
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload Windows
        uses: ./.github/actions/fork-upload
        with:
          name: windows.exe-unsigned
          file: ReStudio-${{ steps.base.outputs.build }}.exe
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload macOS aarch64 archive
        uses: ./.github/actions/fork-upload
        with:
          name: mac-aarch64.sit-unsigned
          file: ReStudio-${{ steps.base.outputs.build }}-aarch64.sit
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload the .dmg build scripts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: dmg-build-scripts
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.ARTIFACTS_DIR }}/macos-dmg-build/

  dmg:
    runs-on: macos-latest
    needs: distributions
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download the .dmg build scripts
        uses: actions/download-artifact@v7.0.0
        with:
          name: dmg-build-scripts

      - name: Download the aarch64 archive
        uses: actions/download-artifact@v7.0.0
        with:
          name: mac-aarch64.sit-unsigned

      - name: Build the aarch64 .dmg
        shell: bash
        run: /bin/bash ./build.sh

      - name: Upload the .dmg
        uses: ./.github/actions/fork-upload
        with:
          name: mac-aarch64.dmg-unsigned
          file: ReStudio-${{ needs.distributions.outputs.build }}-aarch64.dmg
          artifacts_dir: .

  smoke-test:
    needs: distributions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: linux.tar.gz-unsigned
          - os: windows
            runner: windows-latest
            artifact: windows.exe-unsigned
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: fork

      - name: Download the installer
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: installer

      - name: Start the IDE on Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          mkdir ide
          tar -xzf installer/*.tar.gz -C ide --strip-components 1
          fork/smoke-test.sh xvfb-run -a ide/bin/idea.sh

      - name: Install the IDE on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', '/D=C:\ReStudio'
          Get-ChildItem C:\ReStudio, C:\ReStudio\restudio-plugins

      - name: Start the IDE on Windows
        if: matrix.os == 'windows'
        shell: bash
        run: fork/smoke-test.sh /c/ReStudio/bin/idea64.exe

  release:
    runs-on: ubuntu-latest
    needs: [distributions, dmg, smoke-test]
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: fork

      - name: Download the installers
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: '*-unsigned'
          path: dist
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          ls -l dist
          notes=$(cat <<'EOF'
          Unsigned preview build of ReStudio.

          macOS: the app is not signed or notarized. Gatekeeper blocks it at the first start. Remove the quarantine flag once:

              xattr -dr com.apple.quarantine /Applications/ReStudio.app

          Each installer has a .sha256 file next to it.
          EOF
          )
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReStudio ${TAG#restudio/}" \
            --notes "$notes" \
            --prerelease

      - name: Publish the update metadata
        shell: bash
        # The IDE reads updates.xml from the update-metadata release (ReStudioBranding.UPDATES_URL in build/src).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          BUILD: ${{ needs.distributions.outputs.build }}
        run: |
          fork/make-updates-xml.sh "$BUILD" "${TAG#restudio/v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > updates.xml
          cat updates.xml
          if ! gh release view update-metadata --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create update-metadata --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Update metadata" --notes "ReStudio reads updates.xml from this release. Do not delete it." --prerelease
          fi
          gh release upload update-metadata updates.xml --repo "$GITHUB_REPOSITORY" --clobber
