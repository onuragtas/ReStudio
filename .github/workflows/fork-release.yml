# Fork only: builds the IDE installers and publishes them as a GitHub release.
#
# It does not call ide_build_and_upload.yml. That workflow uses .github/actions/build_ide, which checks out
# JetBrains/android at github.ref. The fork branch and the release tags do not exist in JetBrains/android, so the
# checkout fails. This workflow checks out JetBrains/android at the upstream base tag in fork/UPSTREAM_BASE.
#
# Start it with a tag push (restudio/v0.1.0) or by hand. A run by hand without a tag builds the installers only.
name: Fork - release

on:
  push:
    tags:
      - 'restudio/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example restudio/v0.1.0. Leave it empty to build without a release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACTS_DIR: out/idea-ce/artifacts

jobs:
  # A local release (.claude/skills/restudio-release) creates the tag with the release. The tag push then starts
  # this workflow. This job stops the workflow, because the release exists already.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $TAG exists. The workflow builds nothing."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  distributions:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      build: ${{ steps.base.outputs.build }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Free disk space
        shell: bash
        # The same cleanup as .github/actions/build_ide. The build runs inside Docker.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/microsoft /opt/google \
            /imagegeneration /var/cache/apt/archives
          sudo apt-get -y clean
          docker image prune --all --force || true
          docker builder prune --all --force || true
          df -h /

      - name: Expand swap
        shell: bash
        # The build can run out of memory with the default 4 GB swap.
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Read the upstream base
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$(tr -d '[:space:]' < fork/UPSTREAM_BASE)" >> "$GITHUB_OUTPUT"
          echo "build=$(fork/next-build-number.sh "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

      - name: Checkout JetBrains/android at the upstream base
        uses: actions/checkout@v6.0.2
        with:
          repository: JetBrains/android
          path: android
          ref: refs/tags/${{ steps.base.outputs.tag }}

      - name: Fetch the bundled plugins
        shell: bash
        # The build reads out/restudio-plugins. Without it, the installers have no Dart, Flutter, Python and LSP4IJ.
        run: fork/fetch-bundled-plugins.sh

      - name: Build environment
        shell: bash
        run: docker build . --target intellij_idea --tag intellij_idea

      # The Bazel disk cache keeps the compiled modules between runs. Without it, each run compiles for 24 minutes.
      # The key changes with each commit, so each successful run saves a new entry. The restore takes the newest
      # entry of the same upstream base. GitHub removes the oldest entries above 10 GB.
      - name: Restore the Bazel disk cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/ide-cache/JetBrains/monorepo-bazel-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('fork/UPSTREAM_BASE') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ hashFiles('fork/UPSTREAM_BASE') }}-
            bazel-disk-${{ runner.os }}-

      - name: Build
        shell: bash
        # ReStudio has no Windows distribution (decision of 9 November 2026). The Windows installer step took 16-18 minutes.
        run: |
          mkdir -p "$RUNNER_TEMP/ide-cache"
          docker run --rm --user "$(id -u)" --volume "${PWD}:/community" --volume "$RUNNER_TEMP/ide-cache:/home/ide_builder/.cache" intellij_idea \
            -Dbuild.number=${{ steps.base.outputs.build }} -Dintellij.build.skip.build.steps=windows_artifacts

      - name: Show the cache size
        shell: bash
        run: du -sh "$RUNNER_TEMP"/ide-cache/JetBrains/* || true

      - name: Check the bundled plugins
        shell: bash
        run: fork/check-bundled-plugins.sh "$ARTIFACTS_DIR"/*.tar.gz

      - name: Upload Linux x64
        uses: ./.github/actions/fork-upload
        with:
          name: installer-linux.tar.gz
          file: ReStudio-${{ steps.base.outputs.build }}.tar.gz
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload Linux aarch64
        uses: ./.github/actions/fork-upload
        with:
          name: installer-linux-aarch64.tar.gz
          file: ReStudio-${{ steps.base.outputs.build }}-aarch64.tar.gz
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      # The mac job signs these archives, makes the .dmg files and uploads them again as installer-mac*.
      - name: Upload macOS x64 archive
        uses: ./.github/actions/fork-upload
        with:
          name: mac.sit-unsigned
          file: ReStudio-${{ steps.base.outputs.build }}.sit
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload macOS aarch64 archive
        uses: ./.github/actions/fork-upload
        with:
          name: mac-aarch64.sit-unsigned
          file: ReStudio-${{ steps.base.outputs.build }}-aarch64.sit
          artifacts_dir: ${{ env.ARTIFACTS_DIR }}

      - name: Upload the .dmg build scripts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: dmg-build-scripts
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.ARTIFACTS_DIR }}/macos-dmg-build/

  # The Linux build has no codesign. This job signs, notarizes and staples each .sit with fork/sign-mac.sh, then makes
  # the .dmg. Without the signing secrets, it makes an unsigned .dmg. The secrets:
  #   MAC_CERTIFICATE_P12, MAC_CERTIFICATE_PASSWORD  The "Developer ID Application" certificate with its key, in base64.
  #   RESTUDIO_MAC_SIGN_IDENTITY                     The certificate name, "Developer ID Application: <team> (<team ID>)".
  #   APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY  The App Store Connect API key. APPLE_PRIVATE_KEY is the .p8 content.
  mac:
    runs-on: macos-latest
    needs: distributions
    timeout-minutes: 240
    strategy:
      matrix:
        arch: ['', '-aarch64']
    env:
      SIT: ReStudio-${{ needs.distributions.outputs.build }}${{ matrix.arch }}.sit
      DMG: ReStudio-${{ needs.distributions.outputs.build }}${{ matrix.arch }}.dmg
      SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            fork
            platform/build-scripts/tools/mac/scripts

      - name: Download the .dmg build scripts
        uses: actions/download-artifact@v7.0.0
        with:
          name: dmg-build-scripts
          path: dmg

      - name: Download the archive
        uses: actions/download-artifact@v7.0.0
        with:
          name: mac${{ matrix.arch }}.sit-unsigned
          path: dmg

      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/restudio-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # codesign needs the intermediate certificate for the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Sign and notarize the archive
        if: env.SIGNED == 'true'
        shell: bash
        env:
          RESTUDIO_MAC_SIGN_IDENTITY: ${{ secrets.RESTUDIO_MAC_SIGN_IDENTITY }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          export APPLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$APPLE_PRIVATE_KEY" > "$APPLE_PRIVATE_KEY_FILE"
          fork/sign-mac.sh "dmg/$SIT" platform/build-scripts/tools/mac/scripts/entitlements.xml
          rm "$APPLE_PRIVATE_KEY_FILE"

      - name: Build the .dmg
        shell: bash
        working-directory: dmg
        # The .sit has the ticket already, so build.sh does not staple again.
        run: STAPLE=false CONTENT_SIGNED="$SIGNED" /bin/bash ./build.sh

      - name: Check Gatekeeper
        if: env.SIGNED == 'true'
        shell: bash
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "dmg/$DMG"
          xcrun stapler validate "$mount"/*.app
          spctl --assess --type execute --verbose "$mount"/*.app
          hdiutil detach "$mount"

      - name: Upload the archive
        uses: ./.github/actions/fork-upload
        with:
          name: installer-mac${{ matrix.arch }}.sit
          file: ${{ env.SIT }}
          artifacts_dir: dmg

      - name: Upload the .dmg
        uses: ./.github/actions/fork-upload
        with:
          name: installer-mac${{ matrix.arch }}.dmg
          file: ${{ env.DMG }}
          artifacts_dir: dmg

  smoke-test:
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: fork

      - name: Download the installer
        uses: actions/download-artifact@v7.0.0
        with:
          name: installer-linux.tar.gz
          path: installer

      - name: Start the IDE on Linux
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          mkdir ide
          tar -xzf installer/*.tar.gz -C ide --strip-components 1
          fork/smoke-test.sh xvfb-run -a ide/bin/restudio.sh

  release:
    runs-on: ubuntu-latest
    needs: [distributions, mac, smoke-test]
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      # fork/make-patches.sh builds the updater from updater/ with Gradle and the Java of the runner.
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            fork
            updater

      - name: Download the installers
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: 'installer-*'
          path: dist
          merge-multiple: true

      - name: Publish the release and the update metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          BUILD: ${{ needs.distributions.outputs.build }}
          SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' && 'true' || 'false' }}
        run: |
          ls -l dist
          fork/publish-release.sh "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" "$BUILD" dist/*
