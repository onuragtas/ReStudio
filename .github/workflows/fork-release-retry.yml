# Fork only: runs the failed jobs of "Fork - release" again when GitHub had no free runner for them.
#
# GitHub stops a job after 15 minutes when it finds no runner, for example no macOS arm64 runner. Then the job is
# cancelled and has no runner name. This workflow starts the failed jobs again and waits for them, up to six times.
# It does not run a job again after a real failure: the job of a real failure has a runner name.
#
# The retry loop is in one job, because a run again with the GITHUB_TOKEN does not start a new workflow_run event.
name: Fork - release retry

on:
  workflow_run:
    workflows: ['Fork - release']
    types: [completed]

permissions:
  actions: write
  contents: read

# One retry loop for each release run. A second event for the same run waits for the first loop.
concurrency:
  group: fork-release-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run the jobs without a runner again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --jq '.jobs[]')"
            no_runner="$(jq -r 'select(.conclusion == "cancelled" and (.runner_name // "") == "") | .name' <<< "$jobs")"
            failed="$(jq -r 'select(.conclusion == "failure") | .name' <<< "$jobs")"
            if [ -n "$failed" ]; then
              echo "These jobs failed on a runner. The workflow does not run them again:"
              echo "$failed"
              exit 0
            fi
            if [ -z "$no_runner" ]; then
              echo "No job waits for a runner."
              exit 0
            fi
            echo "Attempt $attempt. These jobs had no runner:"
            echo "$no_runner"
            # Wait a little. A free runner is more probable some minutes later.
            sleep 300
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/rerun-failed-jobs"
            sleep 60
            while [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .status)" != completed ]; do
              sleep 60
            done
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)"
            echo "The run is $conclusion"
            if [ "$conclusion" = success ]; then
              exit 0
            fi
          done
          echo "Six attempts had no runner. Run the failed jobs again by hand." >&2
          exit 1
